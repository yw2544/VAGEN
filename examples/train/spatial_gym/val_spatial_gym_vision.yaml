envs:
  - name: SpatialGym
    n_envs: 50
    data_source: spatial_gym
    seed: [0, 49, 1]
    max_turns: 20             # max_exp_steps(10) + cogmap(1) + eval_tasks(9)
    response_length_per_turn: 2048
    config:
      exp_type: active
      render_mode: vision
      max_exp_steps: 10
      data_dir: vagen/envs/spatial_gym/room_data/1-room
      eval_tasks:
        - task_type: dir
        - task_type: rot
        - task_type: pov
        - task_type: e2a
        - task_type: fwd_loc
        - task_type: fwd_fov
        - task_type: bwd_pov_vision
        - task_type: bwd_loc_vision
        - task_type: bwd_nav_vision
      prompt_config:
        enable_think: true
      require_perception: false
      enable_eval_tasks: true
      eval_task_reward_scale: 0.0   # validation only — no reward signal
