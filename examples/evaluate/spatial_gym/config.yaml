defaults:
  - ../../../vagen/configs/eval_default

fileroot: ${oc.env:HOME}/projects/vagen

envs:
  - name: SpatialGym
    n_envs: 50
    tag_id: spatial_gym_2room
    seed: [400, 449, 1]
    max_turns: 25
    config:
      exp_type: active
      render_mode: vision
      max_exp_steps: 15
      data_dir: ../../../vagen/envs/spatial_gym/room_data/2-room
      eval_tasks:
        - task_type: dir
        - task_type: rot
        - task_type: pov
        - task_type: e2a
        - task_type: fwd_loc
        - task_type: fwd_fov
        - task_type: bwd_pov_vision
        - task_type: bwd_loc_vision
        - task_type: bwd_nav_vision
      prompt_config:
        enable_think: true
      require_perception: true
      enable_eval_tasks: true
    chat_config:
      temperature: 0.0
      max_tokens: 32768
      top_p: 1.0

experiment:
  dump_dir: ./rollouts/spatial_gym_2room
  default_max_turns: 25

run:
  backend: "openai"
  base_seed: 0
  max_concurrent_jobs: 3
  resume: skip_completed
  live_summary: true

backends:
  openai:
    api_key: ""               # or export OPENAI_API_KEY
    base_url: null
    model: "gpt-4.1-mini"
    max_concurrency: 3
    max_retries: 6
    min_backoff: 1.0
    max_backoff: 16.0
